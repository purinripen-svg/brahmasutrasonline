<body>

<a class="skip-link" href="#main">Skip to content</a>

<header class="site-header">
    <div class="container">

        <a href="index.html" class="logo">
            BrahmaSutrasOnline
        </a>

        <nav aria-label="Main navigation">
            <a href="index.html">Home</a>
            <a href="sutras.html">Sūtras</a>

            <a href="resources.html">Resources</a>

        </nav>

</header>

<main id="main" class="container">

    <nav class="breadcrumb" aria-label="Breadcrumb">
        <a href="index.html">Home</a>

        <a href="sutras.html">Sūtras</a>
        <span aria-hidden="true"> / </span>
        <span id="breadcrumb-number">Sūtra</span>

    <div id="sutra-loading" aria-live="polite">

        <section id="translation-section">

            <h2>Translation</h2>

            <div id="sutra-translations"></div>

            <h2>Explanation</h2>

        <section id="commentary-section">

            <h2>Traditional Commentaries</h2>

            <div id="sutra-commentaries"></div>

        </section>

        <section id="references-section">

            <h2>References</h2>

            <ul id="sutra-references"></ul>

    <div
        id="sutra-error"
        class="error-message"
        role="alert"
        hidden
