name: Validate content

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  validate-content:
    name: Validate content (schemas & files)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install validator packages
        run: |
          npm ci --silent || true
          npm install --no-audit --no-fund ajv ajv-formats

      - name: Run content validation
        run: npm run validate:content
        env:
          CI: true
